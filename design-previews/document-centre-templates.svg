<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title description">
  <title id="title">Certificate and learner ID card template concepts</title>
  <desc id="description">Three printable certificate concepts and three matching learner ID card concepts, shown with sample school and learner details.</desc>
  <defs>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10264b"/>
      <stop offset="1" stop-color="#244b78"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4d58b"/>
      <stop offset="1" stop-color="#c99435"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e7490"/>
      <stop offset="1" stop-color="#164e63"/>
    </linearGradient>
    <linearGradient id="plum" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6b315d"/>
      <stop offset="1" stop-color="#3e315f"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#10243c" flood-opacity=".14"/>
    </filter>
    <style>
      .sans{font-family:Arial,Helvetica,sans-serif}
      .serif{font-family:Georgia,'Times New Roman',serif}
      .title{font:700 29px Arial,Helvetica,sans-serif;fill:#17365d}
      .sub{font:15px Arial,Helvetica,sans-serif;fill:#63748b}
      .school{font:700 14px Arial,Helvetica,sans-serif;letter-spacing:1.6px}
      .small{font:12px Arial,Helvetica,sans-serif}
      .tiny{font:10px Arial,Helvetica,sans-serif}
      .cert-name{font:italic 24px Georgia,'Times New Roman',serif}
      .cert-title{font:700 23px Georgia,'Times New Roman',serif;letter-spacing:2px}
      .card-name{font:700 16px Arial,Helvetica,sans-serif}
      .card-meta{font:11px Arial,Helvetica,sans-serif}
    </style>
  </defs>
  <rect width="1600" height="1120" fill="#f3f6fa"/>
  <text x="54" y="52" class="title">Document Centre · Design proposals</text>
  <text x="54" y="79" class="sub">Print-ready concepts for school-branded certificates and learner ID cards · Sample content only</text>
  <text x="54" y="119" class="sans" font-size="16" font-weight="700" fill="#17365d">CERTIFICATES · A4 LANDSCAPE</text>

