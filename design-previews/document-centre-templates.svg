  <text x="1310" y="489" text-anchor="middle" class="sans" font-size="14" font-weight="700" fill="#17365d">03 · ACADEMIC HONOUR</text>
  <text x="1310" y="508" text-anchor="middle" class="small" fill="#63748b">Plum · laurel · ceremonial seal</text>

  <text x="54" y="561" class="sans" font-size="16" font-weight="700" fill="#17365d">LEARNER ID CARDS · WALLET-SIZE LANDSCAPE · FRONT SIDE</text>

