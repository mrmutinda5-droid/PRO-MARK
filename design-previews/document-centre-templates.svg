    <rect x="0" y="239" width="472" height="31" rx="0" fill="#f3ead4"/>
    <text x="236" y="259" text-anchor="middle" class="tiny" fill="#73581f">If found, please return to the school office</text>
  </g>
  <text x="290" y="877" text-anchor="middle" class="sans" font-size="14" font-weight="700" fill="#17365d">01 · CLASSIC SCHOOL ID</text>

