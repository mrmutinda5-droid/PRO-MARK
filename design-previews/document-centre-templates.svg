  <text x="1310" y="877" text-anchor="middle" class="sans" font-size="14" font-weight="700" fill="#17365d">03 · ACADEMIC CREST</text>

  <rect x="54" y="930" width="1492" height="104" rx="12" fill="#fff" stroke="#e2e8f0"/>
